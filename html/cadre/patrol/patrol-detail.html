<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巡查记录详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body data-end="cadre">
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="patrol-records.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">巡查记录详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 照片区 -->
    <div class="card">
      <div class="card-title">巡查照片</div>
      <div class="photo-grid">
        <div class="photo-item"><img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=river%20view%20in%20rural%20village%20clean%20water%20realistic%20photo&image_size=landscape_4_3" alt="河道全景" style="width:100%;height:80px;object-fit:cover;border-radius:8px;"></div>
        <div class="photo-item"><img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=debris%20clutter%20piled%20at%20rural%20village%20road%20corner%20realistic%20photo&image_size=landscape_4_3" alt="杂物堆放处" style="width:100%;height:80px;object-fit:cover;border-radius:8px;"></div>
        <div class="photo-item"><img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=potholes%20damaged%20village%20bridge%20road%20surface%20realistic%20photo&image_size=landscape_4_3" alt="路面破损" style="width:100%;height:80px;object-fit:cover;border-radius:8px;"></div>
      </div>
    </div>

    <!-- 基本信息 -->
    <div class="card">
      <div class="card-title">基本信息</div>
      <div class="info-row">
        <div class="info-label">巡查日期</div>
        <div class="info-value">2026-06-28</div>
      </div>
      <div class="info-row">
        <div class="info-label">巡查区域</div>
        <div class="info-value">第三网格（村南片区）</div>
      </div>
      <div class="info-row">
        <div class="info-label">巡查人</div>
        <div class="info-value">张建国</div>
      </div>
      <div class="info-row">
        <div class="info-label">定位方式</div>
        <div class="info-value"><span class="tag tag-blue">GPS定位</span></div>
      </div>
      <div class="info-row">
        <div class="info-label">所属计划</div>
        <div class="info-value">幸福村第三网格巡查</div>
      </div>
    </div>

    <!-- 巡查记录全文 -->
    <div class="card">
      <div class="card-title">巡查记录</div>
      <p style="font-size:14px;color:#333;line-height:1.8;">
        <b>一、环境卫生：</b>村南片区主道路面整洁，垃圾桶均已完成清理，公共区域无积存垃圾。
      </p>
      <p style="font-size:14px;color:#333;line-height:1.8;margin-top:8px;">
        <b>二、问题发现：</b>村南路口有3处杂物堆放，已现场拍照并通知相关村民限期清理；村南桥头路面有2处坑洞，约20-30cm直径，已记录上报，建议尽快安排修补。
      </p>
      <p style="font-size:14px;color:#333;line-height:1.8;margin-top:8px;">
        <b>三、处理情况：</b>杂物堆放问题已现场通知3户户主，预计2日内清理完成。路面破损问题已上报村委会，等待安排维修。
      </p>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
<script>
(function(){var p=new URLSearchParams(window.location.search);var id=p.get('id')||'1';var hint=document.createElement('div');hint.style.cssText='text-align:center;font-size:12px;color:#9CA3AF;padding:8px;background:#F3F4F6;margin:12px 16px;border-radius:8px;';hint.textContent='当前查看：第 '+id+' 条记录';var main=document.querySelector('.page-content')||document.querySelector('main');if(main)main.insertBefore(hint,main.firstChild);})();
</script>
</body>
</html>
