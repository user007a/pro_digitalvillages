  <!-- 页面内容 -->
  <main class="page-content">
    <!-- Tab切换 -->
    <div class="tab-switch" role="tablist">
      <a class="tab-btn active" href="patrol-plan.html" role="tab" aria-selected="true">巡查计划</a>
      <a class="tab-btn" href="patrol-records.html" role="tab">巡查记录</a>
      <a class="tab-btn" href="patrol-stats.html" role="tab">巡查统计</a>
    </div>

    <!-- 计划列表 -->
    <div class="list-card" style="margin-top:0;">
      <!-- 计划1：待巡查 -->
      <div class="list-item" role="button" onclick="location.href='patrol-checkin.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-blue">待巡查</span>
            幸福村第一网格
          </div>
          <div class="item-desc">日期：2026-08-11（周二）</div>
          <div class="item-desc2">区域：第一网格（村东片区）</div>
          <div class="item-desc2">要点：检查河道卫生、垃圾清运、路面状况</div>
        </div>
        <div class="item-right">
          <button class="btn btn-primary btn-sm">开始巡查</button>
        </div>
      </div>

      <!-- 计划2：待巡查 -->
      <div class="list-item" role="button" onclick="location.href='patrol-checkin.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-blue">待巡查</span>
            幸福村第二网格
          </div>
          <div class="item-desc">日期：2026-08-13（周四）</div>
          <div class="item-desc2">区域：第二网格（村西片区）</div>
          <div class="item-desc2">要点：检查道路安全、路灯照明</div>
        </div>
        <div class="item-right">
          <button class="btn btn-primary btn-sm">开始巡查</button>
        </div>
      </div>

      <!-- 计划3：已完成 -->
      <div class="list-item" role="button" onclick="location.href='patrol-detail.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-green">已完成</span>
            幸福村第三网格
          </div>
          <div class="item-desc">日期：2026-06-28（周日）</div>
          <div class="item-desc2">区域：第三网格（村南片区）</div>
          <div class="item-desc2">发现问题2处，已处理1处</div>
        </div>
        <div class="item-right">
          <button class="btn btn-default btn-sm">查看记录</button>
        </div>
      </div>

      <!-- 计划4：已过期 -->
      <div class="list-item" role="button" onclick="location.href='patrol-detail.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-red">已过期</span>
            幸福村第四网格
          </div>
          <div class="item-desc">日期：2026-06-20（周六）</div>
          <div class="item-desc2">区域：第四网格（村北片区）</div>
          <div class="item-desc2">已补打卡完成</div>
        </div>
        <div class="item-right">
          <button class="btn btn-default btn-sm">查看记录</button>
        </div>
      </div>
    </div>
