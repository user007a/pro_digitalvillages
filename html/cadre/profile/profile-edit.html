<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑信息</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body data-end="cadre">
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="profile.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">编辑信息</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 头像上传 -->
    <div class="card">
      <div class="avatar-upload">
        <div class="avatar-box" onclick="showToast('选择头像图片')"><img src="../../images/avatar-cadre.jpg" alt="头像" style="width:60px;height:60px;border-radius:50%;object-fit:cover;"></div>
        <div>
          <div style="font-size:15px;font-weight:500;color:#333;">修改头像</div>
          <div class="text-sm text-gray mt-8">支持 jpg、png 格式</div>
        </div>
      </div>
    </div>

    <form data-validate onsubmit="return false">
    <!-- 姓名 -->
    <div class="form-group">
      <div class="form-label">姓名</div>
      <input type="text" name="name" class="form-input" value="张建国" readonly style="background:#f5f5f5;color:#999;" autocomplete="name">
      <div class="text-sm text-gray mt-8">姓名不可修改</div>
    </div>

    <!-- 手机号 -->
    <div class="form-group">
      <div class="form-label">手机号</div>
      <div class="flex gap-8">
        <input type="tel" name="phone" class="form-input" value="138****5678" style="flex:1;" required autocomplete="tel">
        <button class="btn btn-default btn-sm" style="flex-shrink:0;" onclick="var btn=this;btn.disabled=true;btn.style.opacity='0.5';var s=60;btn.textContent=s+'s后重发';var t=setInterval(function(){s--;btn.textContent=s+'s后重发';if(s<=0){clearInterval(t);btn.disabled=false;btn.style.opacity='';btn.textContent='获取验证码';}},1000);showToast('验证码已发送')">获取验证码</button>
      </div>
      <div class="flex gap-8 mt-8">
        <input type="text" name="code" class="form-input" placeholder="请输入验证码…" style="flex:1;" autocomplete="one-time-code" spellcheck="false">
      </div>
    </div>

    <!-- 详细地址 -->
    <div class="form-group">
      <div class="form-label">详细地址</div>
      <input type="text" name="address" class="form-input" value="XX省XX市XX县幸福村村委会" autocomplete="street-address">
    </div>
    </form>

    <!-- 保存按钮 -->
    <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="showToast('保存成功')">保存</button>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
