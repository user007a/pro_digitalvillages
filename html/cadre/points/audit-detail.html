<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body data-end="cadre">
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="audit-list.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">审核详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 村民信息 -->
    <div class="card">
      <div class="card-title">村民信息</div>
      <div class="info-row">
        <div class="info-label">村民姓名</div>
        <div class="info-value text-bold">王明</div>
      </div>
      <div class="info-row">
        <div class="info-label">积分事项</div>
        <div class="info-value">参加义务劳动</div>
      </div>
      <div class="info-row">
        <div class="info-label">申请分值</div>
        <div class="info-value text-blue text-bold">+20分</div>
      </div>
      <div class="info-row">
        <div class="info-label">申请时间</div>
        <div class="info-value">2026-06-29 14:00</div>
      </div>
    </div>

    <!-- 申请说明 -->
    <div class="card">
      <div class="card-title">申请说明</div>
      <p style="font-size:14px;color:#333;line-height:1.8;">
        2026年6月29日上午，我参加了村里组织的义务劳动活动，协助保洁员清理村口至村委会沿线道路两侧的积存垃圾和杂草，持续工作约4小时。劳动内容包括清扫路面、搬运垃圾、铲除杂草等。
      </p>
    </div>

    <!-- 申请照片 -->
    <div class="card">
      <div class="card-title">申请照片</div>
      <div class="photo-grid">
        <div class="photo-item"><img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=villagers%20volunteer%20labor%20cleaning%20village%20road%20sweeping%20garbage%20weeds%20rural%20China%20realistic%20photo&image_size=landscape_4_3" alt="劳动现场" style="width:100%;height:80px;object-fit:cover;border-radius:8px;"></div>
        <div class="photo-item"><img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=clean%20tidy%20village%20road%20after%20cleaning%20rural%20village%20China%20realistic%20photo&image_size=landscape_4_3" alt="清理成果" style="width:100%;height:80px;object-fit:cover;border-radius:8px;"></div>
      </div>
      <div class="text-sm text-gray mt-8">点击照片可放大查看</div>
    </div>

    <!-- 积分规则对照 -->
    <div class="card">
      <div class="card-title">积分规则对照</div>
      <div class="info-row">
        <div class="info-label">规则名称</div>
        <div class="info-value">参加义务劳动</div>
      </div>
      <div class="info-row">
        <div class="info-label">标准分值</div>
        <div class="info-value text-green text-bold">+20分</div>
      </div>
      <div class="info-row">
        <div class="info-label">规则说明</div>
        <div class="info-value">参加村内组织的义务劳动活动，每次可获得20积分</div>
      </div>
    </div>

    <!-- 底部操作按钮 -->
    <div class="btn-row" style="padding:16px;">
      <button class="btn btn-success" onclick="showModal('审核确认', '确认通过该积分申请？', function(){ showToast('审核通过'); })">通过</button>
      <button class="btn btn-danger" onclick="var reason = prompt('请输入驳回原因'); if (reason) { showToast('已驳回：' + reason); }">驳回</button>
      <button class="btn btn-warning" onclick="var score = prompt('请输入调整后的分值', '5'); if(score) { showToast('分值已调整为' + score + '分'); }">调整分值</button>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
<script>
(function(){var p=new URLSearchParams(window.location.search);var id=p.get('id')||'1';var hint=document.createElement('div');hint.style.cssText='text-align:center;font-size:12px;color:#9CA3AF;padding:8px;background:#F3F4F6;margin:12px 16px;border-radius:8px;';hint.textContent='当前查看：第 '+id+' 条记录';var main=document.querySelector('.page-content')||document.querySelector('main');if(main)main.insertBefore(hint,main.firstChild);})();
</script>
</body>
</html>
