<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字乡村 - 办事服务</title>
    <link rel="stylesheet" href="../css/villager.css">
</head>
<body data-end="citizen">
    <div class="phone-container">

        <!-- 顶部导航栏 -->
        <header>
            <div class="nav-bar">
                <div class="nav-back" aria-label="返回"></div>
                <div class="nav-title"><h1>办事服务</h1></div>
                <div class="nav-right"></div>
            </div>
        </header>

        <!-- 页面内容 -->
        <main class="page-content">

            <!-- 搜索栏 -->
            <div class="search-bar">
                <div class="search-input-wrap">
                    <span class="search-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <input type="text" placeholder="搜索办事事项…" aria-label="搜索办事事项" oninput="filterEntries(this.value)" style="font-size:16px;">
                </div>
            </div>

            <!-- 功能入口列表 -->
            <div class="page-body" style="padding-top:0;">

                <!-- 办事指南 -->
                <a class="entry-card" href="guide-list.html" role="button">
                    <div class="entry-icon bg-green" style="background:var(--color-primary-50);color:var(--color-primary-600);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        </svg>
                    </div>
                    <div class="entry-info">
                        <div class="entry-title">办事指南</div>
                        <div class="entry-desc">查看各类事项办理流程和所需材料</div>
                    </div>
                    <div class="entry-arrow"></div>
                </a>

                <!-- 线上申请 -->
                <a class="entry-card" href="apply-form.html" role="button">
                    <div class="entry-icon bg-blue" style="background:var(--color-primary-50);color:var(--color-primary-600);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </div>
                    <div class="entry-info">
                        <div class="entry-title">线上申请</div>
                        <div class="entry-desc">在线提交办事申请材料</div>
                    </div>
                    <div class="entry-arrow"></div>
                </a>

                <!-- 办理进度查询 -->
                <a class="entry-card" href="my-records.html" role="button">
                    <div class="entry-icon bg-orange">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </div>
                    <div class="entry-info">
                        <div class="entry-title">办理进度查询</div>
                        <div class="entry-desc">随时查看办事进度和结果</div>
                    </div>
                    <div class="entry-arrow"></div>
                </a>

            </div>
        </main>

        <!-- 底部TabBar -->
        <nav class="tab-bar" role="tablist">
            <a class="tab-item" href="../index.html" role="tab">
                <div class="tab-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <div class="tab-label">首页</div>
            </a>
            <a class="tab-item active" href="../service/service-home.html" role="tab" aria-current="page">
                <div class="tab-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                </div>
                <div class="tab-label">服务</div>
            </a>
            <a class="tab-item" href="../points/points-home.html" role="tab">
                <div class="tab-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <div class="tab-label">积分</div>
            </a>
            <a class="tab-item" href="../profile/profile.html" role="tab">
                <div class="tab-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="tab-label">我的</div>
            </a>
        </nav>

    </div>
    <script src="../js/villager.js"></script>
<script>
function filterEntries(keyword) {
  var cards = document.querySelectorAll('.entry-card');
  keyword = keyword.toLowerCase();
  cards.forEach(function(card) {
    var title = card.querySelector('.entry-title');
    var desc = card.querySelector('.entry-desc');
    var text = (title ? title.textContent : '') + (desc ? desc.textContent : '');
    card.style.display = text.toLowerCase().indexOf(keyword) >= 0 ? '' : 'none';
  });
}
</script>
</body>
</html>
