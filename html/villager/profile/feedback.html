<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字乡村 - 意见反馈</title>
<link rel="stylesheet" href="../css/villager.css">
</head>
<body data-end="citizen">
<div class="phone-container">
<header>
  <div class="nav-bar"><div class="nav-back" aria-label="返回"></div><h1 class="nav-title">意见反馈</h1><div class="nav-right"></div></div>
</header>
<main class="page-content"><div class="page-body"><form data-validate onsubmit="return false"><div class="form-group"><label class="form-label">反馈类型</label><select class="form-select" required style="font-size:16px;"><option value="">请选择反馈类型</option><option>功能建议</option><option>问题反馈</option><option>投诉建议</option><option>其他</option></select></div><div class="form-group"><label class="form-label">反馈内容</label><textarea name="content" class="form-textarea" placeholder="请详细描述您的问题或建议…" required autocomplete="off" style="font-size:16px;"></textarea></div><div class="form-group"><label class="form-label">联系方式 <span style="color:#999;font-weight:400;">(可选)</span></label><input type="text" name="contact" class="form-input" placeholder="方便我们联系您…" autocomplete="tel" style="font-size:16px;"></div><div class="form-group"><label class="form-label">图片上传 <span style="color:#999;font-weight:400;">(可选)</span></label><div class="upload-area"><div class="upload-item">+<span class="upload-hint">最多上传3张</span></div></div></div></form><button type="button" class="btn-primary">提交</button></div></main>
</div>
<script src="../js/villager.js"></script>
</body>
</html>
