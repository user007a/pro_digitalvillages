<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字乡村 - 实名认证</title>
  <link rel="stylesheet" href="css/villager.css">
</head>
<body data-end="citizen">
  <div class="phone-container">
    <!-- 导航栏 -->
    <header>
      <div class="nav-bar">
        <div class="nav-back" aria-label="返回"></div>
        <h1 class="nav-title">实名认证</h1>
        <div class="nav-right"></div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-body">
        <div style="text-align:center;padding:20px 0 24px;">
          <div style="width:56px;height:56px;border-radius:50%;background:#e8f8ee;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></div>
          <div style="font-size:16px;color:#333;font-weight:500;">为保障您的权益，请完成实名认证</div>
        </div>

        <form data-validate onsubmit="return false">
          <div class="card">
          <div class="form-group">
            <label class="form-label">姓名</label>
            <input type="text" name="name" class="form-input" value="李秀兰" readonly required autocomplete="name" style="font-size:16px;">
          </div>
          <div class="form-group">
            <label class="form-label">身份证号</label>
            <input type="text" name="idcard" class="form-input" placeholder="请输入身份证号…" maxlength="18" required autocomplete="off" spellcheck="false" style="font-size:16px;">
          </div>
          <div class="form-group">
            <label class="form-label">手机号</label>
            <input type="tel" name="phone" class="form-input" placeholder="请输入手机号…" maxlength="11" required autocomplete="tel" style="font-size:16px;">
          </div>
          <button type="button" class="btn-primary" data-redirect="index.html">提交认证</button>
        </div>
        </form>

        <div style="text-align:center;padding:16px 0;font-size:12px;color:#999;line-height:1.6;">
          认证信息仅用于身份核实，不对外展示
        </div>
      </div>
    </main>
  </div>
  <script src="js/villager.js"></script>
</body>
</html>
