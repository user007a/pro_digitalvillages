<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300"><style>text{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Microsoft JhengHei',sans-serif;fill:#334155;}.title{font-size:20px;font-weight:700;fill:#0F172A;}.subtitle{font-size:12px;font-weight:500;fill:#64748B;}.node-title{font-size:13px;font-weight:600;}.node-sub{font-size:10.5px;fill:#475569;}.label{font-size:11px;font-weight:500;fill:#64748B;}.caption{font-size:11px;fill:#64748B;}</style><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#CBD5E1"/></marker><marker id="arP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/></marker><marker id="arA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/></marker></defs><rect width="1120" height="300" fill="#FFFFFF"/><text x="560" y="36" text-anchor="middle" class="title">图 5-9  设备管理流程</text><g><rect x="36" y="95" width="124" height="50" rx="25" ry="25" fill="#2563EB" stroke="#2563EB" stroke-width="1.2"/><text x="98" y="126" text-anchor="middle" class="node-title" style="fill:#FFFFFF">台账登记</text></g><g><rect x="190" y="95" width="124" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="252" y="118" text-anchor="middle" class="node-title" style="fill:#334155">接入配置</text><text x="252" y="134" text-anchor="middle" class="node-sub">协议/通道</text></g><line x1="160" y1="120" x2="190" y2="120" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="344" y="95" width="124" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="406" y="118" text-anchor="middle" class="node-title" style="fill:#334155">状态监测</text><text x="406" y="134" text-anchor="middle" class="node-sub">在线/离线</text><